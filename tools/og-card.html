<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/assets/css/site.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #fbfaf5; color-scheme: light; }
  .card { position: relative; width: 1200px; height: 630px; padding: 72px 80px; display: flex; flex-direction: column; justify-content: space-between; color: #262a24; }
  .wm { position: absolute; right: -30px; top: -70px; font-family: "Syntheo Kanji", serif; font-weight: 700; font-size: 520px; line-height: 1; color: rgba(49,103,69,0.07); }
  h1 { margin: 0; font-family: "Newsreader Variable", serif; font-weight: 500; font-size: 80px; line-height: 1.02; letter-spacing: -0.015em; max-width: 900px; position: relative; }
  h1 span { color: #316745; }
  .k { font-family: "Newsreader Variable", serif; font-style: italic; font-size: 40px; color: #316745; margin-top: 18px; position: relative; }
  .foot { display: flex; align-items: center; gap: 24px; font-family: "Geist Variable", sans-serif; font-size: 24px; color: #5c6357; position: relative; }
  .foot img { height: 44px; width: auto; }
  .foot .grow { flex-grow: 1; }
</style>
</head>
<body>
<div class="card">
  <div class="wm">茶</div>
  <div>
    <h1>What's said in the room <span>stays in the room.</span></h1>
    <div class="k">Even the AI.</div>
  </div>
  <div class="foot">
    <img src="/assets/img/logo-light.svg" alt="Syntheo">
    <span class="grow"></span>
    <span>Open-source meeting notes · 100% local · syntheo.studio</span>
  </div>
</div>
</body>
</html>
