<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/assets/css/site.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #fbfaf5; color-scheme: light; }
  .card { position: relative; width: 1200px; height: 630px; padding: 72px 80px; display: flex; flex-direction: column; justify-content: space-between; color: #262a24; }
  .wm { position: absolute; right: -30px; top: -70px; font-family: "Syntheo Kanji", serif; font-weight: 700; font-size: 520px; line-height: 1; color: rgba(49,103,69,0.07); }
  h1 { margin: 0; font-family: "Newsreader Variable", serif; font-weight: 500; font-size: 80px; line-height: 1.02; letter-spacing: -0.015em; max-width: 1040px; position: relative; }
  h1 span { color: #316745; }
  .k { font-family: "Newsreader Variable", serif; font-style: italic; font-size: 40px; color: #316745; margin-top: 18px; position: relative; }
  .foot { display: flex; align-items: center; gap: 24px; font-family: "Geist Variable", sans-serif; font-size: 24px; color: #5c6357; position: relative; }
  .foot img { height: 44px; width: auto; }
  .foot .grow { flex-grow: 1; }
</style>
</head>
<body>
<!-- Image d'aperçu : ouvrir /tools/og-card.html (anglais) ou /tools/og-card.html?lang=fr, capture 1200 × 630 vers assets/img/og-en.png ou og-fr.png. -->
<div class="card">
  <div class="wm">茶</div>
  <div>
    <h1 data-fr="Ici, tout peut se dire.&lt;br&gt; &lt;span&gt;Et rester chez vous.&lt;/span&gt;">Say anything in the room.<br> <span>Keep it in the room.</span></h1>
    <div class="k" data-fr="IA comprise, avec vos propres modèles.">Even the AI, with your own models.</div>
  </div>
  <div class="foot">
    <img src="/assets/img/logo-light.svg" alt="Syntheo">
    <span class="grow"></span>
    <span data-fr="Comptes rendus open source · vos propres modèles · syntheo.studio">Open-source meeting notes · your own models · syntheo.studio</span>
  </div>
</div>
<script>
  if (new URLSearchParams(location.search).get("lang") === "fr") {
    document.documentElement.lang = "fr";
    document.querySelectorAll("[data-fr]").forEach(function (el) { el.innerHTML = el.getAttribute("data-fr"); });
  }
</script>
</body>
</html>
